# cargo-deny: run with `cargo deny check`.

[licenses]
# The copyleft entries cover heic, zenwebp, rav1d-safe (AGPL) and
# jpegxl-sys (GPL); they make a built binary AGPL-3.0 (see README).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # paste is unmaintained; pulled in by zenwebp and rav1d-safe, no
    # replacement upstream.
    { id = "RUSTSEC-2024-0436", reason = "transitive via zenwebp/rav1d-safe" },
]
