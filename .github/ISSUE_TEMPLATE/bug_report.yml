name: Bug report
description: A file fails to convert, converts wrongly, or the tool misbehaves.
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Output of `jxlall --version`, plus OS and architecture.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected versus actual result, with the full error output.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input file
      description: >-
        Format and source (camera, phone, software). Attach the file if you
        can share it; strip private metadata such as GPS first if it does
        not matter for the bug.
