# Pushing a tag vX.Y.Z builds every target natively and publishes a GitHub
# release. A manual run builds and smoke-tests everything without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds on the oldest runner image for wide distro support.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Static musl builds run natively inside Alpine.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, alpine: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, alpine: true }
          # ONNX Runtime has no x86_64 macOS (nor musl) build: no AI features there.
          - { target: x86_64-apple-darwin, os: macos-26-intel, cargo_flags: --no-default-features }
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      CARGO_FLAGS: ${{ matrix.cargo_flags }}
      ARCHIVE: jxlall-${{ needs.version.outputs.version }}-${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SVT-AV1 (AVIF encoder) sources.
          submodules: true

      - if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # SVT-AV1's x86-64 assembly.
      - name: Install NASM
        if: ${{ runner.arch == 'X64' && !matrix.alpine }}
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq nasm ;;
            macOS) brew install nasm ;;
            Windows) choco install nasm -y --no-progress ;;
          esac

      # LLVM for the optimized SVT-AV1 build (LTO + PGO, see the svt-av1-sys
      # build script). Windows gets the full official toolchain: the
      # installer lacks llvm-link.
      - name: Install LLVM
        if: ${{ !matrix.alpine }}
        shell: bash
        env:
          LLVM_VERSION: 23.1.6
        run: |
          case "$TARGET" in
            *linux*)
              sudo apt-get update -qq && sudo apt-get install -y -qq clang-15 llvm-15
              bin=/usr/lib/llvm-15/bin ;;
            *apple*)
              brew install llvm
              bin="$(brew --prefix llvm)/bin" ;;
            x86_64-pc-windows-msvc | aarch64-pc-windows-msvc)
              case "$TARGET" in
                x86_64*) sha=7623f582089983c1cb51030cf1996514b19464e5669099571b399e8543770155 ;;
                aarch64*) sha=d3f65e879cd4b1524a0c85c871e0fc26164644b28e618fc341fac7850d48ea38 ;;
              esac
              name="clang+llvm-$LLVM_VERSION-$TARGET"
              curl -fsSL -o "$RUNNER_TEMP/llvm.tar.zst" \
                "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.zst"
              echo "$sha  $RUNNER_TEMP/llvm.tar.zst" | sha256sum -c -
              zstd -dc "$RUNNER_TEMP/llvm.tar.zst" | tar -xf - -C "$RUNNER_TEMP"
              bin=$(cygpath -m "$RUNNER_TEMP/$name/bin")
              choco install ninja -y --no-progress ;;
          esac
          echo "JXLALL_SVT_LLVM=$bin" >> "$GITHUB_ENV"

      - name: Build
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          if [[ $TARGET == *windows* ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          profile=$(.github/svt-pgo.sh "$TARGET" $CARGO_FLAGS)
          JXLALL_SVT_PGO="use:$profile" cargo build --release --locked --target "$TARGET" $CARGO_FLAGS

      - name: Build (Alpine)
        if: ${{ matrix.alpine }}
        run: .github/build-alpine.sh "$TARGET"

      - name: Smoke test
        shell: bash
        run: .github/smoke/run.sh "target/$TARGET/release/jxlall"

      - name: Package
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          mkdir "$ARCHIVE"
          cp "target/$TARGET/release/jxlall" LICENSE README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:ARCHIVE | Out-Null
          Copy-Item "target/$env:TARGET/release/jxlall.exe", LICENSE, README.md $env:ARCHIVE
          Compress-Archive $env:ARCHIVE "$env:ARCHIVE.zip"

      - if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}.*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum jxlall-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes
