[package]
name = "jxlall"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Convert a photo library to JPEG XL, keeping pixels, color and metadata"
repository = "https://github.com/Miosp/jxlall"

[dependencies]
compio = { version = "0.19", features = ["runtime", "fs", "polling"] }
jpegxl-sys = { version = "0.13", features = ["vendored"] }
heic = { version = "0.1.6", features = ["std", "av1"] }
zenwebp = "0.4"
zune-jpeg = "0.5"
ignore = "0.4"
jpeg-decoder = "0.3"
png = "0.18"
tiff = "0.11"
kamadak-exif = "0.6"
clap = { version = "4", features = ["derive"] }
ultrahdr-core = { version = "0.6", default-features = false, features = ["std"] }
roxmltree = "0.21.1"
rustfft = "6.4"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24", "directml"], optional = true }
libloading = { version = "0.9", optional = true }
ureq = { version = "3.5", optional = true }
directories = { version = "6", optional = true }
sha2 = { version = "0.11", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[features]
default = ["ai"]
# --dejpeg and --iqa load ONNX Runtime at run time. Static musl binaries cannot
# load shared libraries and x86_64 macOS has no official core; build those
# without this feature.
ai = ["dep:ort", "dep:libloading", "dep:ureq", "dep:directories", "dep:sha2", "dep:zip", "dep:flate2", "dep:tar"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"

[dev-dependencies]
jpeg-encoder = "0.7"
